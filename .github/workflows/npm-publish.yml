name: Node.js Package Publish

on:
  release:
    types: [created]

# OIDC 인증을 위해 GitHub ID 토큰을 npm에 제시할 수 있는 권한을 부여합니다.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      # --provenance 옵션을 붙여 비밀 토큰 없이 OIDC 신뢰 연동만으로 안전하게 배포합니다.
      - name: Publish Package to npm
        run: npm publish --provenance
